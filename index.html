<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסלול טיול</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial;
  direction: rtl;
  background: linear-gradient(#dbeafe,#fdf2f8);
}

.app {
  max-width: 620px;
  margin: auto;
  padding: 20px;
}

.hero {
  background: linear-gradient(135deg,#2563eb,#ec4899);
  color: white;
  padding: 25px;
  border-radius: 25px;
  margin-bottom: 20px;
}

.day-card {
  background: white;
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.day-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.day-number {
  background: #f97316;
  color: white;
  padding: 6px 12px;
  border-radius: 999px;
}

.date {
  background: #eef2ff;
  padding: 6px 12px;
  border-radius: 999px;
}

.stop {
  display: flex;
  gap: 10px;
  background: #fff7ed;
  border-radius: 14px;
  padding: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.stop:hover {
  background: #eef2ff;
}

.time {
  background: #2563eb;
  color: white;
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 12px;
  min-width: 90px;
  text-align: center;
}

.stop-text strong {
  display: block;
}

.stop-text small {
  display: block;
  margin-top: 4px;
  color: #6b7280;
  font-size: 13px;
  line-height: 1.4;
}

.map {
  height: 260px;
  margin-top: 10px;
  border-radius: 15px;
}
</style>
</head>

<body>

<div class="app">
  <div class="hero">
    <h1>✈️ מסלול הטיול</h1>
    <p>מילאנו - יום מלא</p>
  </div>

  <div id="days"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const maps = {};
const markers = {};
let lastMarker = null;

const tripDays = [
{
  day: 2,
  date: "12.07",
  title: "מילאנו - יום מלא",
  stops: [
    {
      timeRange: "10:00–12:00",
      title: "CityLife Shopping District",
      description: "מתחילים את הבוקר בקניון המודרני ובמתחם המגדלים.",
      lat: 45.4777, lng: 9.1566
    },
    {
      timeRange: "12:00–12:30",
      title: "נסיעה ל-Arco della Pace",
      description: "מעבר לאזור המרכזי של היום.",
      lat: 45.4758, lng: 9.1722
    },
    {
      timeRange: "12:30–14:00",
      title: "פארק סמפיונה והאקווריום",
      description: "הליכה בפארק וביקור באקווריום.",
      lat: 45.4722, lng: 9.1780
    },
    {
      timeRange: "14:00–15:00",
      title: "Five Guys",
      description: "ארוחת צהריים והמבורגר.",
      lat: 45.4668, lng: 9.1848
    },
    {
      timeRange: "15:00–15:30",
      title: "פסל L.O.V.E",
      description: "עצירה קצרה לצילום.",
      lat: 45.4655, lng: 9.1834
    },
    {
      timeRange: "15:30–17:30",
      title: "LEGO Store",
      description: "עצירת קניות בדרך לדואומו.",
      lat: 45.4659, lng: 9.1848
    },
    {
      timeRange: "15:30–17:30",
      title: "Uniqlo",
      description: "עצירת קניות נוספת.",
      lat: 45.4659, lng: 9.1857
    },
    {
      timeRange: "17:30–20:00",
      title: "דואומו והגלריה",
      description: "שיא היום.",
      lat: 45.4642, lng: 9.1900
    },
    {
      timeRange: "20:00–21:00",
      title: "KFC",
      description: "עצירת אוכל אם רעבים.",
      lat: 45.4636, lng: 9.1912
    },
    {
      timeRange: "21:00 ואילך",
      title: "Primark",
      description: "קניות וסיום היום.",
      lat: 45.4645, lng: 9.1895
    },
    {
      timeRange: "בסוף היום",
      title: "חזרה למלון",
      description: "חזרה למלון אחרי Primark.",
      lat: 45.4863, lng: 9.2387
    }
  ]
}
];

function focusOnPoint(day,index){
  const marker = markers[day][index];
  const map = maps[day];

  if(lastMarker) lastMarker.setOpacity(1);

  marker.setOpacity(0.6);
  lastMarker = marker;

  map.setView(marker.getLatLng(),16);
  marker.openPopup();
}

const container = document.getElementById("days");

tripDays.forEach(day=>{
  const el=document.createElement("div");
  el.className="day-card";

  el.innerHTML=`
    <div class="day-top">
      <span class="day-number">יום ${day.day}</span>
      <span class="date">${day.date}</span>
    </div>

    <h2>${day.title}</h2>

    ${day.stops.map((s,i)=>`
      <div class="stop" onclick="focusOnPoint(${day.day},${i})">
        <span class="time">${s.timeRange}</span>
        <span class="stop-text">
          <strong>${s.title}</strong>
          <small>${s.description}</small>
        </span>
      </div>
    `).join("")}

    <div class="map" id="map-${day.day}"></div>
  `;

  container.appendChild(el);

  const map=L.map(`map-${day.day}`);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

  maps[day.day]=map;
  markers[day.day]=[];

  const pts=[];

  day.stops.forEach((s,i)=>{
    const marker=L.marker([s.lat,s.lng]).addTo(map).bindPopup(s.title);
    markers[day.day].push(marker);
    pts.push([s.lat,s.lng]);
  });

  L.polyline(pts).addTo(map);
  map.fitBounds(pts);
});
</script>

</body>
</html>
